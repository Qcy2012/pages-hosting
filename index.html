<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>静态网站托管 | Qcy's Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .btn-animate {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-animate:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-animate:active {
            transform: translateY(0) scale(0.95);
        }

        .floating-icon {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .fa-random-img-placeholder {
            font-size: 4rem;
            color: white;
            text-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <nav class="w-full p-6 flex justify-between items-center z-10">
        <div class="flex items-center space-x-4 group cursor-pointer">
            <div class="bg-white/20 p-3 rounded-full backdrop-blur-sm transition-transform duration-300 group-hover:rotate-12">
                <i class="fa-solid fa-cloud-arrow-up fa-random-img-placeholder floating-icon"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white tracking-wider drop-shadow-md">静态网站托管 | Qcy's Blog</h1>
                <p class="text-white/80 text-sm font-light">快速、稳定、安全</p>
            </div>
        </div>

        <a href="https://www.qcyblog.dpdns.org" class="btn-animate bg-white/90 hover:bg-white text-indigo-600 font-semibold py-2 px-6 rounded-2xl shadow-lg backdrop-blur-md flex items-center gap-2">
            <i class="fa-solid fa-house"></i>
            <span>返回主站</span>
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 z-10">
        <div class="glass-panel w-full max-w-4xl p-8 md:p-12 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 right-0 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl translate-x-1/3 translate-y-1/3"></div>

            <h2 class="text-4xl md:text-5xl font-extrabold text-white mb-6 drop-shadow-sm">
                静态网站托管
            </h2>
            <p class="text-lg text-white/90 mb-10 max-w-2xl mx-auto leading-relaxed">
                我们提供极速的静态资源分发网络，支持一键部署 HTML/CSS/JS 项目。
                无论是个人博客、作品集还是文档站点，都能在这里一键部署并查看。
            </p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="bg-white/10 p-6 rounded-xl hover:bg-white/20 transition-colors duration-300 backdrop-blur-sm border border-white/10">
                    <i class="fa-solid fa-bolt text-3xl text-yellow-300 mb-3"></i>
                    <h3 class="text-white font-bold text-lg">极速加载</h3>
                    <p class="text-white/70 text-sm mt-2">全球CDN加速，毫秒级响应</p>
                </div>
                <div class="bg-white/10 p-6 rounded-xl hover:bg-white/20 transition-colors duration-300 backdrop-blur-sm border border-white/10">
                    <i class="fa-solid fa-shield-halved text-3xl text-green-300 mb-3"></i>
                    <h3 class="text-white font-bold text-lg">SSL 加密</h3>
                    <p class="text-white/70 text-sm mt-2">免费自动配置 HTTPS 证书</p>
                </div>
                <div class="bg-white/10 p-6 rounded-xl hover:bg-white/20 transition-colors duration-300 backdrop-blur-sm border border-white/10">
                    <i class="fa-solid fa-code-branch text-3xl text-blue-300 mb-3"></i>
                    <h3 class="text-white font-bold text-lg">Git 集成</h3>
                    <p class="text-white/70 text-sm mt-2">推送代码即自动部署更新</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button class="btn-animate bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-full shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rocket"></i>
                    立即开始部署
                </button>
                <button class="btn-animate bg-transparent border-2 border-white text-white hover:bg-white/10 font-bold py-3 px-8 rounded-full shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-book"></i>
                    查看文档
                </button>
            </div>
        </div>
    </main>

    <footer class="w-full p-6 text-center text-white/60 text-sm z-10">
        <p>&copy; 2026 pages-hosting | Qcy's Blog</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    console.log('Button clicked:', this.innerText);
                });
            });

            const cards = document.querySelectorAll('.grid > div');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 300 + (index * 100));
            });
        });
    </script>
</body>
</html>
